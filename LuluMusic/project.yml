name: LuluMusic
options:
  bundleIdPrefix: com.lulumusic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: false
targets:
  LuluMusic:
    type: application
    platform: iOS
    sources:
      - path: LuluMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lulumusic.app
        PRODUCT_NAME: LuluMusic
        INFOPLIST_FILE: LuluMusic/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LoveSong
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_ENTITLEMENTS: LuluMusic/LuluMusic.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5595Y4TR6U
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"LuluMusic/Preview Content\""
        TARGETED_DEVICE_FAMILY: 1
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    scheme:
      testTargets: []
